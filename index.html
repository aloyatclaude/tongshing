<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日通胜</title>
<meta name="description" content="每日通胜宜忌、神煞、方位、时辰吉凶，并按个人生辰八字解读今日。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<script src="personal.js"></script>
<style>
:root{
  --bg:#f5f2ec; --surface:#ffffff; --surface-2:#faf8f4; --line:#e7e1d7; --line-2:#d9d1c4;
  --ink:#1e1c19; --ink-2:#4f4a43; --muted:#8a8378;
  --accent:#8c2b23; --accent-soft:#f5e9e6;
  --good:#2e5b45; --good-soft:#e8f0eb; --bad:#9b3127; --bad-soft:#f7e9e6;
  --gold:#9a7433; --gold-soft:#f6efe1;
  --wood:#4d7a5a; --fire:#b0503c; --earth:#9a7638; --metal:#7c8189; --water:#3d6487;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(30,28,25,.04),0 4px 16px rgba(30,28,25,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131210; --surface:#1b1a17; --surface-2:#211f1b; --line:#2d2a25; --line-2:#3a362f;
    --ink:#ece6dc; --ink-2:#c3bbaf; --muted:#8f877b;
    --accent:#d27a6d; --accent-soft:#2c1c19;
    --good:#8dbb9f; --good-soft:#1a2620; --bad:#df8174; --bad-soft:#2c1c19;
    --gold:#d1a85e; --gold-soft:#2a2418;
    --wood:#86b393; --fire:#dc8a74; --earth:#cfa868; --metal:#a9aeb5; --water:#7fa6c8;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#131210; --surface:#1b1a17; --surface-2:#211f1b; --line:#2d2a25; --line-2:#3a362f;
  --ink:#ece6dc; --ink-2:#c3bbaf; --muted:#8f877b;
  --accent:#d27a6d; --accent-soft:#2c1c19;
  --good:#8dbb9f; --good-soft:#1a2620; --bad:#df8174; --bad-soft:#2c1c19;
  --gold:#d1a85e; --gold-soft:#2a2418;
  --wood:#86b393; --fire:#dc8a74; --earth:#cfa868; --metal:#a9aeb5; --water:#7fa6c8;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.12em}
.seal{width:30px;height:30px;border:1.5px solid var(--accent);color:var(--accent);border-radius:4px;display:grid;place-items:center;font-size:15px;letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:5px 16px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}

/* ---------- date bar ---------- */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 16px;flex-wrap:wrap}
.datebar .nav{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:16px;color:var(--ink-2)}
.iconbtn:hover,.btn:hover{border-color:var(--ink-2)}
.datewrap{position:relative;display:flex;align-items:center;gap:8px}
.datepick{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-size:17px;font-weight:600;padding:5px 12px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer}
.datepick:hover,.datepick:focus-visible{background:var(--surface);border-color:var(--line-2)}
.datepick svg{flex:none;color:var(--muted)}
.datewrap input{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.datewrap input.visible{position:static;width:auto;height:36px;opacity:1;pointer-events:auto;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--surface)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.on{border-color:var(--accent);color:var(--accent)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;position:relative}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px}
.sec-h h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.06em}
.sec-h .sub{font-size:12.5px;color:var(--muted)}
.section-title{font-family:var(--serif);font-size:13px;letter-spacing:.3em;color:var(--muted);margin:32px 0 12px;display:flex;align-items:center;gap:12px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}
.dayblock{text-align:center;padding-right:28px;border-right:1px solid var(--line)}
.dayblock .num{font-family:var(--serif);font-size:76px;line-height:1;font-weight:700;color:var(--accent)}
.dayblock .ym{font-size:13px;color:var(--muted);margin-top:8px;letter-spacing:.05em}
.lunar{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.08em}
.gz{font-family:var(--serif);font-size:16px;color:var(--ink-2);margin-top:2px;letter-spacing:.05em}
.meta{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.meta span:not(:last-child)::after{content:"·";margin:0 10px;color:var(--line-2)}
.meta .hl{color:var(--accent);font-weight:500}
.meta .ok{color:var(--good);font-weight:500}
.yiji{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-top:22px}
.yj{display:flex;gap:14px;align-items:flex-start}
.stamp{flex:none;width:40px;height:40px;border-radius:6px;display:grid;place-items:center;font-family:var(--serif);font-size:21px;font-weight:700;color:#fff}
.stamp.yi{background:var(--good)} .stamp.ji{background:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15.5px;line-height:1.8;padding-top:5px}

/* ---------- tags & lists ---------- */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;line-height:1.5;padding:2px 9px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tag.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tag.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:10px 16px;margin:0;font-size:14.5px}
.kv dt{color:var(--muted);font-size:13.5px;padding-top:1px}
.kv dd{margin:0;min-width:0}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:14px}
.poem{font-family:var(--serif);font-size:14px;color:var(--ink-2);line-height:1.9}

/* ---------- 五行 bars ---------- */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:22px 1fr 26px;gap:12px;align-items:center;font-size:14px}
.bar .el{font-family:var(--serif);font-weight:700}
.bar .track{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar .fill{height:100%}
.bar .st{text-align:right;font-family:var(--serif);font-weight:600}

/* ---------- compass ---------- */
.compass{display:flex;justify-content:center}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 12px;font-size:13px;margin-top:8px}
.legend span{color:var(--muted)} .legend b{font-weight:500;color:var(--ink)}

/* ---------- personal today ---------- */
.you{border-left:3px solid var(--accent)}
.you .head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
.you .title{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.04em}
.you .title em{font-style:normal;color:var(--accent)}
.stars{color:var(--gold);letter-spacing:3px;font-size:16px}
.stars .off{color:var(--line-2)}
.you .desc{color:var(--ink-2);margin-top:4px}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:16px 0 20px;font-size:15px;line-height:1.85}
.summary b{color:var(--accent);font-weight:600}
.shalist{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--ink-2)}
.shalist li{padding:2px 0} .shalist li b{font-weight:600;color:var(--ink)}
.prompt{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface-2);border-style:dashed}
.prompt p{margin:0;color:var(--ink-2)}

/* ---------- hours ---------- */
.hours{display:flex;flex-direction:column}
.hour{display:grid;grid-template-columns:92px 74px minmax(0,1.1fr) minmax(0,1.6fr) 128px;gap:16px;padding:14px 8px;border-top:1px solid var(--line);font-size:13.5px;align-items:start}
.hour:first-child{border-top:0}
.hour.now{background:var(--gold-soft);border-radius:8px;border-color:transparent}
.hour.now + .hour{border-color:transparent}
.hour .t b{font-family:var(--serif);font-size:16px;font-weight:600;display:block}
.hour .t span{color:var(--muted);font-size:12.5px}
.hour .t .nowtag{color:var(--gold);font-weight:600}
.luck{font-family:var(--serif);font-weight:600;font-size:14px}
.luck.good{color:var(--good)} .luck.bad{color:var(--bad)}
.luck small{display:block;font-family:var(--sans);font-weight:400;color:var(--muted);font-size:12px}
.hour .yj-line{line-height:1.7;color:var(--ink-2)}
.hour .yj-line i{font-style:normal;font-family:var(--serif);font-weight:700;margin-right:6px}
.hour .yj-line i.y{color:var(--good)} .hour .yj-line i.j{color:var(--bad)}
.hour .side{color:var(--muted);font-size:12.5px;line-height:1.7}
.hour .side b{color:var(--ink-2);font-weight:500}
.hour .tags{gap:4px} .hour .tag{font-size:12px;padding:1px 7px}
.hour .mine{grid-column:3/-1;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}

/* ---------- natal ---------- */
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:end}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 12px}
.field input:focus,.field select:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);height:40px}
.form .actions{display:flex;gap:8px}
.form .actions .btn{height:40px}
.pillars{width:100%;border-collapse:collapse;text-align:center}
.pillars th{font-size:12.5px;color:var(--muted);font-weight:500;padding:8px 4px;border-bottom:1px solid var(--line)}
.pillars th.row{text-align:left;width:52px}
.pillars td{padding:8px 4px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.pillars tr:last-child td,.pillars tr:last-child th{border-bottom:0}
.pillars .big{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.2}
.pillars .day{background:var(--accent-soft)}
.pillars .ss{display:block;font-size:11.5px;color:var(--muted)}
.dayun{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.dayun div{border:1px solid var(--line);border-radius:6px;padding:8px 2px;text-align:center;font-size:12px;color:var(--muted);line-height:1.5}
.dayun div b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:600}
.dayun div.cur{border-color:var(--accent);background:var(--accent-soft)}
.dayun div.cur b{color:var(--accent)}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .serif{font-size:20px;color:var(--ink);margin-bottom:6px}

/* ---------- compare & footer ---------- */
.chk{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--muted)}
.chk.ok{background:var(--good);border-color:var(--good);color:#fff}
.chk.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.chk.abs{position:absolute;top:16px;right:16px}
footer{margin:40px 0 32px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer .tools{display:flex;gap:8px;flex-wrap:wrap}
footer .btn{font-size:12.5px;padding:4px 12px}
[hidden]{display:none!important}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .hour{grid-template-columns:84px 64px minmax(0,1fr);}
  .hour .yj-line{grid-column:1/-1}
  .hour .side{grid-column:1/-1;display:flex;gap:16px}
  .hour .mine{grid-column:1/-1}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form .actions{grid-column:1/-1}
  .dayun{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .topbar .wrap{height:54px}
  .brand{font-size:17px} .seal{width:26px;height:26px;font-size:13px}
  .tabs button{padding:4px 12px;font-size:13px}
  .card{padding:18px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr);gap:14px}
  .dayblock{display:flex;align-items:baseline;gap:12px;text-align:left;border-right:0;padding-right:0}
  .dayblock .num{font-size:56px}
  .dayblock .ym{margin-top:0}
  .lunar{font-size:22px}
  .yiji{grid-template-columns:minmax(0,1fr);gap:16px}
  .you .title{font-size:20px}
  .pillars .big{font-size:24px}
  .kv{grid-template-columns:72px 1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="seal">胜</span>每日通胜</div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">今日通胜</button>
      <button role="tab" data-tab="me" aria-selected="false">我的命盘</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="datebar" id="datebar">
    <div class="nav">
      <button class="iconbtn" id="prev" aria-label="前一日">‹</button>
      <div class="datewrap">
        <button type="button" class="datepick" id="datePick" title="选择日期"><span id="dateLabel"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
        <input type="date" id="date" aria-label="选择日期" tabindex="-1">
      </div>
      <button class="iconbtn" id="next" aria-label="后一日">›</button>
    </div>
    <button class="btn ghost" id="today">回到今天</button>
  </div>

  <main id="viewToday" class="stack"></main>

  <main id="viewMe" class="stack" hidden style="margin-top:24px">
    <section class="card">
      <div class="sec-h"><h3>输入生辰</h3><span class="sub">只保存在你自己的设备上</span></div>
      <form class="form" id="meForm">
        <div class="field"><label for="meDate">出生日期（公历）</label><input type="date" id="meDate" required></div>
        <div class="field"><label for="meTime">出生时间</label><input type="time" id="meTime"></div>
        <div class="field"><label for="meGender">性别（用于大运）</label>
          <select id="meGender"><option value="">不填</option><option value="m">男</option><option value="f">女</option></select></div>
        <label class="check"><input type="checkbox" id="meNoTime"> 不知道出生时辰</label>
        <div class="actions"><button class="btn primary" type="submit">排盘</button><button class="btn" type="button" id="meClear">清除</button></div>
      </form>
    </section>
    <div id="natal" class="stack"></div>
  </main>

  <footer>
    <span>依《协纪辨方书》规则推算（lunar-javascript）；当旺五行、个人神煞、喜用为本站按规则计算，仅供参考。所有计算在你的浏览器内完成，资料不会上传。</span>
    <span class="tools">
      <button class="btn ghost" id="cmp">对比模式</button>
      <button class="btn ghost" id="export">导出对比记录</button>
      <button class="btn ghost" id="clear">清除记录</button>
    </span>
  </footer>
</div>

<script>
const WX = ['木','火','土','金','水'];
const WX_COLOR = {木:'var(--wood)',火:'var(--fire)',土:'var(--earth)',金:'var(--metal)',水:'var(--water)'};
const SI_LI = {'立春':'木','立夏':'火','立秋':'金','立冬':'水'};
const DIRS = ['正北','东北','正东','东南','正南','西南','正西','西北']; // clockwise from N
const DIR_ALIAS = {'北':'正北','东':'正东','南':'正南','西':'正西'};
const WEEK = ['日','一','二','三','四','五','六'];
const BAD_SHA = ['羊刃','劫煞','亡神','空亡'];
const $ = id => document.getElementById(id);

let cur = new Date(); cur.setHours(12,0,0,0);
let cmpMode = false;
let tab = 'today';
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('ts-check')||'{}'); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem('ts-check', JSON.stringify(v)); }catch(e){} }
};

const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d,12); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tags = (arr, cls) => arr.map(x => `<span class="tag ${cls}">${esc(x)}</span>`).join('');

// 当旺五行：四立定季节，四立前18日为土旺用事
function wangXiang(date){
  const pts = [];
  for (const off of [-200, 0, 200]) {
    const d = new Date(date); d.setDate(d.getDate()+off);
    const tbl = Solar.fromDate(d).getLunar().getJieQiTable();
    for (const [k,v] of Object.entries(tbl)) if (SI_LI[k]) pts.push({name:k, ymd:v.toYmd()});
  }
  const uniq = [...new Map(pts.map(p => [p.ymd,p])).values()].sort((a,b)=>a.ymd<b.ymd?-1:1);
  const today = ymd(date);
  const prev = uniq.filter(p => p.ymd <= today).pop();
  const next = uniq.find(p => p.ymd > today);
  const daysToNext = Math.round((toDate(next.ymd) - toDate(today)) / 864e5);
  const tuWang = daysToNext <= 18;
  const wang = tuWang ? '土' : SI_LI[prev.name];
  const i = WX.indexOf(wang);
  const state = {};
  state[WX[i]] = '旺'; state[WX[(i+1)%5]] = '相'; state[WX[(i+4)%5]] = '休';
  state[WX[(i+3)%5]] = '囚'; state[WX[(i+2)%5]] = '死';
  return {wang, state, tuWang, prev, next, daysToNext};
}

function chkBtn(key, abs){
  if (!cmpMode) return '';
  const v = store.get()[ymd(cur)+'|'+key];
  const cls = v==='ok'?'ok':v==='bad'?'bad':'';
  const label = v==='ok'?'✓ 一致':v==='bad'?'✗ 不同':'对比';
  return `<button class="chk ${cls} ${abs?'abs':''}" data-key="${esc(key)}">${label}</button>`;
}
const secH = (title, sub, key) => `<div class="sec-h"><h3>${title}</h3><span class="sub">${sub||''} ${chkBtn(key)}</span></div>`;

function compassSVG(gods){
  const S = 280, C = 140, R = 126, r0 = 40;
  let s = `<svg viewBox="0 0 ${S} ${S}" width="100%" style="max-width:280px" role="img" aria-label="方位图">`;
  s += `<circle cx="${C}" cy="${C}" r="${R}" fill="var(--surface-2)" stroke="var(--line-2)"/>`;
  s += `<circle cx="${C}" cy="${C}" r="${R-26}" fill="none" stroke="var(--line)"/>`;
  s += `<circle cx="${C}" cy="${C}" r="${r0}" fill="var(--surface)" stroke="var(--line-2)"/>`;
  DIRS.forEach((d,k) => {
    const a = (k*45 - 90) * Math.PI/180, a2 = ((k*45+22.5) - 90) * Math.PI/180;
    s += `<line x1="${C+r0*Math.cos(a2)}" y1="${C+r0*Math.sin(a2)}" x2="${C+R*Math.cos(a2)}" y2="${C+R*Math.sin(a2)}" stroke="var(--line)"/>`;
    const lr = R - 13;
    s += `<text x="${C+lr*Math.cos(a)}" y="${C+lr*Math.sin(a)+4}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--serif)">${d}</text>`;
    const here = gods.filter(g => g.dir === d);
    here.forEach((g,j) => {
      const gr = 70, off = (j - (here.length-1)/2) * 16;
      s += `<text x="${C+gr*Math.cos(a)}" y="${C+gr*Math.sin(a)+off+4}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${g.color}">${g.name}</text>`;
    });
  });
  s += `<text x="${C}" y="${C+6}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)" font-family="var(--serif)">中</text></svg>`;
  return s;
}

function todayCard(n, l, wx){
  const t = P.today(n, l, wx.wang);
  const good = t.sha.filter(s => !BAD_SHA.includes(s));
  const badR = t.rels.filter(r => r.bad);
  const wxTxt = t.wxScore > 0 ? '今日干支五行是你的喜用，做事较顺' : t.wxScore < 0 ? '今日干支五行属你的忌神，凡事多留余地' : '今日五行对你喜忌参半';
  const best = l.getTimes().slice(0,12).filter(h => { const tg = P.hourTags(n,h); return tg.some(x=>!x[1]) && !tg.some(x=>x[1]); }).map(h=>h.getZhi()+'时');
  const parts = [`今天是你的<b>${t.ss}日</b>`];
  if (good.length) parts.push(`${good.join('、')}到位`);
  parts.push(wxTxt);
  if (badR.length) parts.push(`留意今日${badR.map(r=>r.t+'你的'+r.where.replace(/（.*）/,'')).join('、')}`);
  if (best.length) parts.push(`较好的时辰：${best.join('、')}`);
  const stars = `<span>${'★'.repeat(t.stars)}</span><span class="off">${'★'.repeat(5-t.stars)}</span>`;
  return `<section class="card you">
    <div class="head"><div class="title">${t.gz}日 · 你的<em>${t.ss}日</em></div><div><span class="stars" title="综合参考分">${stars}</span> ${chkBtn('个人今日')}</div></div>
    <div class="desc">${P.SS_DESC[t.ss]}<span class="muted">（地支${t.dz}对你为${t.ssZ}）</span></div>
    <div class="summary">${parts.join('；')}。</div>
    <div class="grid2" style="gap:24px">
      <dl class="kv">
        <dt>与本命</dt><dd class="tags">${t.rels.map(r=>`<span class="tag ${r.bad?'bad':'good'}" title="${esc(r.where)}">${r.t} · ${r.where.replace(/（.*）/,'')}</span>`).join('')||'<span class="muted">无明显冲合</span>'}</dd>
        <dt>引动神煞</dt><dd>${t.sha.length?`<div class="tags">${t.sha.map(s=>`<span class="tag ${BAD_SHA.includes(s)?'bad':'good'}">${s}</span>`).join('')}</div><ul class="shalist">${t.sha.map(s=>`<li>${P.SHA_DESC[s]}</li>`).join('')}</ul>`:'<span class="muted">无</span>'}</dd>
      </dl>
      <dl class="kv">
        <dt>今日五行</dt><dd>${ganC(t.dg)}${zhiC(t.dz)}（${t.dayWx.map(i=>P.WX[i]).join('')}）　${t.wxScore>0?'<span class="tag good">喜</span>':t.wxScore<0?'<span class="tag bad">忌</span>':'<span class="tag">平</span>'}</dd>
        <dt>当旺五行</dt><dd>${wx.wang}旺　${t.wangGood?'<span class="tag good">对你有利</span>':'<span class="tag bad">对你不利</span>'}</dd>
        <dt>流年</dt><dd>${t.ly}（${t.lySS}）${t.ty.length?`　<span class="tag bad">${t.ty.join('、')}</span>`:''}</dd>
        ${t.dy?`<dt>大运</dt><dd>${t.dy.getGanZhi()}（${P.shiShen(n.dayGan,t.dy.getGanZhi()[0])}运，${t.dy.getStartYear()}–${t.dy.getEndYear()}）</dd>`:''}
      </dl>
    </div>
    <div class="note">星级为规则加总的参考分，不是定论。</div>
  </section>`;
}

  e.preventDefault();
  const noTime = $('meNoTime').checked;
  profile = { date: $('meDate').value, time: noTime ? '' : ($('meTime').value || ''), gender: $('meGender').value };
  try { localStorage.setItem('ts-me', JSON.stringify(profile)); } catch(e) {}
  render();
};
$('meClear').onclick = () => { profile = null; try { localStorage.removeItem('ts-me'); } catch(e) {} $('meForm').reset(); render(); };
fillForm();
render();
</script>
</body>
</html>
