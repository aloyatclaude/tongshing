<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日通胜</title>
<meta name="description" content="每日通胜宜忌、神煞、方位、时辰吉凶，并按个人生辰八字解读今日。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{ if (localStorage.getItem('ts-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; }catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<script src="personal.js"></script>
<script src="xiyong.js"></script>
<script src="glossary.js"></script>
<style>
/* ============ 设计令牌：颜色只表达意思 — 绿＝吉/宜，红＝凶/忌，灰＝平；品牌用金棕，不与吉凶混淆 ============ */
/* 风格：雅致中式 — 浅色为宣纸（暖纸底、奶白卡片）、墨色字、黛青点缀；绿（玉色）＝吉/宜，红（朱砂）＝凶/忌，灰＝平。
   预设固定浅色，不跟随系统；用户可用顶栏按钮切换深色（data-theme="dark"）。 */
:root{
  --bg:#efeae0; --surface:#faf7f0; --surface-2:#f4f0e7; --line:#e0d8c9; --line-2:#cdc3b1;
  --ink:#262421; --ink-2:#4f4a42; --muted:#8a8273; --accent:#3d5a6c; --accent-soft:#e9eff2;
  --good:#2c7a63; --good-soft:#e5f1ec; --on-good:#fff; --bad:#b8402c; --bad-soft:#f8e8e4; --on-bad:#fff;
  --mid:#6f6a60; --mid-soft:#ece6da; --now:#a67c1f; --now-soft:#faf3e3;
  --wood:#2f8a4c; --fire:#c8382a; --earth:#8b5e34; --metal:#b97c08; --water:#2a6bb3;
  --r:6px; --r2:3px; --card-top:1px solid var(--line); --shadow:none;
  --top-bg:rgba(239,234,224,.94); --top-ink:#262421; --top-muted:#8a8273; --top-line:#e0d8c9; --seal-bg:#3d5a6c; --seal-ink:#fff;
  --serif:"Noto Serif SC","Songti SC","STSong",serif; --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; --head:var(--serif);
  --top-h:56px; --nav-h:64px;
  color-scheme:light;
}
:root[data-theme="dark"]{ /* 墨底、宣纸色字 */
  --bg:#151513; --surface:#1d1d1a; --surface-2:#232320; --line:#33322e; --line-2:#45433e;
  --ink:#ebe8e0; --ink-2:#c9c5bb; --muted:#8f8b82; --accent:#8fb1c3; --accent-soft:#1f2a30;
  --good:#6fc3a5; --good-soft:#17291f; --on-good:#0d1a14; --bad:#ee8a73; --bad-soft:#331d17; --on-bad:#1f0f0b;
  --mid:#a19d94; --mid-soft:#272724; --now:#d9ae52; --now-soft:#2a2414;
  --wood:#6cc48a; --fire:#f08a74; --earth:#c99a6b; --metal:#f0c04a; --water:#74aef0;
  --top-bg:rgba(21,21,19,.92); --top-ink:#ebe8e0; --top-muted:#8f8b82; --top-line:#33322e; --seal-bg:#8fb1c3; --seal-ink:#151513;
  color-scheme:dark;
}
/* 雅致中式：正文也用宋体、细虚线标题 */
body{font-family:var(--serif)}
.daynum{font-weight:600}
.card-h{border-bottom-style:dashed}

*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.serif{font-family:var(--serif)} .muted{color:var(--muted)}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- 顶栏（电脑：品牌＋分页；手机：品牌＋日期） ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--top-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--top-line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--top-h)}
.brand{display:flex;align-items:center;gap:9px;color:var(--top-ink);font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:.1em;white-space:nowrap}
.seal{width:28px;height:28px;border-radius:var(--r2);background:var(--seal-bg);color:var(--seal-ink);display:grid;place-items:center;font-size:14px;letter-spacing:0}
.topright{display:flex;align-items:center;gap:18px}
.themebtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--top-line);background:transparent;color:var(--top-ink);cursor:pointer;display:grid;place-items:center}
.themebtn svg{width:18px;height:18px}
.toptabs{display:none;gap:22px}
.toptabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 2px;cursor:pointer;color:var(--top-muted);font-size:15px}
.toptabs button[aria-selected="true"]{color:var(--top-ink);font-weight:600;border-bottom-color:var(--accent)}

/* ---------- 日期栏 ---------- */
.datebar{display:flex;align-items:center;gap:6px;justify-content:space-between;margin:14px 0}
.datebar .nav{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.iconbtn{flex:none;width:40px;height:40px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:18px;color:var(--ink-2)}
.datewrap{position:relative;flex:1;min-width:0;display:flex;justify-content:center}
.datepick{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-size:17px;font-weight:600;padding:6px 12px;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datepick:hover{background:var(--surface);border-color:var(--line-2)}
.datepick svg{flex:none;color:var(--muted)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.on{border-color:var(--accent);color:var(--accent)}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-top:var(--card-top);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-family:var(--head);font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--ink);display:flex;align-items:center;gap:6px}
.card-h h2::before{content:"";width:4px;height:19px;border-radius:2px;background:var(--accent);margin-right:4px;flex:none}
.card-h .sub{font-size:13px;color:var(--muted)}
.label{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:10px}

/* ---------- 可点击的名词（点一下看解释） ---------- */
.t{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:4px}
.t:hover{text-decoration-style:solid}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;line-height:1.4;padding:4px 9px;border-radius:var(--r2);background:transparent;color:var(--ink-2);border:1px solid var(--line-2);cursor:pointer;text-decoration:none;white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:var(--good-soft)} .chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft)} .chip.brand{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip small{opacity:.75;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:2px 8px;border-radius:var(--r2);white-space:nowrap;letter-spacing:.04em}
.badge.good{background:var(--good);color:var(--on-good)} .badge.bad{background:var(--bad);color:var(--on-bad)} 
.badge .t{font-weight:500}
.badge.mid{background:var(--mid-soft);color:var(--mid)} .badge.brand{gap:0;background:transparent;color:var(--ink);border:1px solid var(--line-2);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)} .dot.mid{background:var(--line-2)}

/* ---------- 今日总览 ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.daynum{font-family:var(--head);font-weight:700;font-size:58px;line-height:1;color:var(--ink);text-align:center;min-width:72px}
.daynum small{display:block;font:500 12.5px/1.4 var(--sans);color:var(--muted);margin-top:6px}
.lunar{font-family:var(--head);font-size:21px;font-weight:600;letter-spacing:.06em}
.gz{font-family:var(--serif);color:var(--ink-2);font-size:15px}
.hero .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.verdict{margin-top:14px;border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.6}
.verdict b{font-family:var(--serif);font-size:16px;white-space:nowrap}
.verdict.good{background:var(--good-soft);color:var(--good)} .verdict.bad{background:var(--bad-soft);color:var(--bad)} .verdict.mid{background:var(--mid-soft);color:var(--ink-2)}
.verdict span{color:var(--ink-2)}
.yiji{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:16px}
.yj{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.stamp{width:44px;height:44px;border-radius:var(--r2);display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:700;color:#fff}
.stamp.yi{background:var(--good);color:var(--on-good)} .stamp.ji{background:var(--bad);color:var(--on-bad)}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:16px;line-height:1.75;padding-top:6px}
.words .strong{color:var(--bad);font-weight:600}
.yjnote{font-size:13px;color:var(--muted);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.meta>span{white-space:nowrap}

/* ---------- 今日对你 ---------- */
.card.you{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:inset 3px 0 0 var(--accent)}
.you-h{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.you-h h2{margin:0;font-family:var(--head);font-size:24px;font-weight:700;letter-spacing:.1em;line-height:1.25}
.you-h .by{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.you-h .by b{font-family:var(--serif);font-weight:700;letter-spacing:.08em;white-space:nowrap}
.mine-tag{display:inline-flex;align-items:center;font:600 12px/1 var(--sans);letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:var(--r2);padding:4px 7px;white-space:nowrap;vertical-align:middle}
.mine-tag.lg{font-size:14px;padding:5px 10px;margin-left:4px}
.intro{margin:0 0 14px;font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.intro b{color:var(--ink)}
.you .title{font-family:var(--head);font-size:20px;font-weight:600;line-height:1.3}
.you .title em{font-style:normal;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.stars{color:var(--now);letter-spacing:2px;font-size:18px;white-space:nowrap} .stars .off{color:var(--line-2)}
.daytags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.dtag{font:700 15px/1.4 var(--sans);letter-spacing:.06em;padding:4px 12px;border-radius:var(--r2);border:0;cursor:pointer;text-decoration:none}
.dtag.good{background:var(--good);color:var(--on-good)} .dtag.bad{background:var(--bad);color:var(--on-bad)} .dtag.mid{background:var(--mid-soft);color:var(--mid)}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0 14px;font-size:15px;line-height:1.8}
.summary b{color:var(--ink)}
.summary p{margin:0}
.sum-hours{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:start;font-size:14.5px}
.sum-hours .hrow{display:contents}
.sum-hours .hl{font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:var(--r2);white-space:nowrap;margin-top:2px;text-align:center}
.sum-hours .hlist{display:flex;flex-wrap:wrap;gap:2px 14px}
.sum-hours .hl.good{background:var(--good);color:var(--on-good)} .sum-hours .hl.bad{background:var(--bad);color:var(--on-bad)}
.sum-hours .nw{white-space:nowrap}
.facts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.fact{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
.fact>.label{padding-top:5px}
.sw-row{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:2px}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
.sw i{width:15px;height:15px;border-radius:50%;border:1px solid var(--line-2);display:inline-block;flex:none}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line-2)}
.cta p{margin:0;color:var(--ink-2)}

/* ---------- 详细资料（折叠） ---------- */
.acc{padding:0;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--ink)}
.acc>summary::before{content:"";width:4px;height:19px;border-radius:2px;background:var(--accent);flex:none;margin-right:-2px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .sub{font:13px var(--sans);color:var(--muted);margin-left:auto}
.acc>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-left:6px;flex:none}
.acc[open]>summary::after{transform:rotate(-135deg)}
.acc .acc-b{padding:0 18px 18px}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px 14px;margin:0;font-size:15px}
.kv dt{color:var(--muted);font-size:14px;padding-top:2px} .kv dd{margin:0;min-width:0}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:24px minmax(0,1fr) 30px;gap:12px;align-items:center;font-size:15px}
.bar .el{font-family:var(--serif);font-weight:700}
.bar .track{height:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;overflow:hidden} .bar .fill{height:100%}
.bar .st{text-align:right;font-family:var(--serif);font-weight:600}
.jg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.jg .c{border:1px solid var(--line);border-radius:var(--r);padding:8px 6px 10px;min-height:76px;background:var(--surface);text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.jg .c .d{font-family:var(--serif);font-size:15.5px;font-weight:700;color:var(--ink);letter-spacing:.08em;line-height:1.3}
.jg .c.mid .d{font-size:12px;font-weight:400;color:var(--muted)}
.jg .c .g{font-family:var(--serif);font-weight:700;font-size:15.5px;line-height:1.25}
.jg .c.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.jg .c.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.jg .c.mix{background:var(--surface-2)}
.jg .c.empty{background:transparent;border-style:dashed}
.jg .c.mid{justify-content:center;background:var(--surface-2)}
.jg .c.mid b{font-family:var(--serif);font-size:20px}
@media (min-width:640px){ .jg{max-width:420px;margin:0 auto} }
.poem{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);line-height:1.9}

/* ---------- 时辰 ---------- */
.legendline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:12px}
.legendline span{display:inline-flex;align-items:center;gap:5px}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-bottom:14px}
.strip button{border:0;border-radius:var(--r2);padding:7px 0 5px;cursor:pointer;font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:3px}
.strip button small{font:500 10.5px var(--sans);opacity:.8}
.strip .good{background:var(--good-soft);color:var(--good)} .strip .bad{background:var(--bad-soft);color:var(--bad)} .strip .mid{background:var(--mid-soft);color:var(--mid)}
.strip .now{outline:2px solid var(--now);outline-offset:1px}
.plan{display:grid;gap:8px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);margin-bottom:12px;font-size:14px}
.plan .row{display:flex;gap:10px;align-items:baseline}
.plan .row>div{display:flex;flex-wrap:wrap;gap:4px 12px}
.plan .row b{font-family:var(--serif)}
.hr{border-top:1px solid var(--line)} .hr:first-child{border-top:0}
.hr-head{width:100%;border:0;background:transparent;cursor:pointer;display:grid;grid-template-columns:78px minmax(0,1fr) auto 16px;gap:10px;align-items:center;padding:12px 4px;text-align:left}
.hr-head .nm b{font-family:var(--serif);font-size:17px;font-weight:600;display:block;line-height:1.2}
.hr-head .nm span{font-size:12.5px;color:var(--muted)}
.hr-head .mid-col{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.hr-head .chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;justify-self:center}
.hr.open .chev{transform:rotate(-135deg)}
.hr.now{background:var(--now-soft);border-radius:var(--r2);border-top-color:transparent}
.hr.now + .hr{border-top-color:transparent}
.nowtag{font:600 11px var(--sans);color:var(--now);margin-left:4px}
.hr-body{padding:2px 6px 16px;display:grid;gap:10px;font-size:14.5px}
.hr-body .kv{grid-template-columns:52px minmax(0,1fr);font-size:14.5px}
.mine{background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:inset 3px 0 0 var(--accent);border-radius:var(--r);padding:10px 12px 10px 15px}
.mine .who{font:600 14.5px/1.4 var(--sans);color:var(--accent);letter-spacing:.06em}
.mine .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}

/* ---------- 命盘 ---------- */
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.selrow{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px} .selrow.two{grid-template-columns:1.6fr 1fr}
.field select{width:100%;height:46px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 10px;font-size:16px}
.form .actions{display:flex;gap:8px} .form .actions .btn{height:46px;flex:1}
.formerr{color:var(--bad);font-size:14px;margin-top:10px}
.pillars-wrap{overflow-x:auto}
.pillars{width:100%;border-collapse:collapse;text-align:center;min-width:300px}
.pillars th{font-size:12.5px;color:var(--muted);font-weight:500;padding:8px 4px;border-bottom:1px solid var(--line)}
.pillars th.row{text-align:left;width:46px}
.pillars td{padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.pillars tr:last-child td,.pillars tr:last-child th{border-bottom:0}

  <button data-tab="hours" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>时辰</button>
  <button data-tab="pick" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V18l-4 2v-7.5z"/></svg>择日</button>
  <button data-tab="me" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>命盘</button>

<div class="sheet-back" id="sheetBack" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<script>
const WX = ['木','火','土','金','水'];
const WX_COLOR = {木:'var(--wood)',火:'var(--fire)',土:'var(--earth)',金:'var(--metal)',水:'var(--water)'};
const SI_LI = {'立春':'木','立夏':'火','立秋':'金','立冬':'水'};
const DIRS = ['正北','东北','正东','东南','正南','西南','正西','西北'];
const DIR_ALIAS = {'北':'正北','东':'正东','南':'正南','西':'正西'};
const WEEK = ['日','一','二','三','四','五','六'];
const BAD_SHA = ['羊刃','劫煞','亡神','空亡'];
const BAD_SHA_PLAIN = {羊刃:'容易冲动、受伤', 劫煞:'防小人、破财', 亡神:'容易分心出错', 空亡:'事情容易落空、拖延'};
const $ = id => document.getElementById(id);
const isDesktop = () => matchMedia('(min-width:1024px)').matches;

let cur = new Date(); cur.setHours(12,0,0,0);
let cmpMode = false, tab = 'today', openHour = null;
const store = { get(){ try{ return JSON.parse(localStorage.getItem('ts-check')||'{}'); }catch(e){ return {}; } }, set(v){ try{ localStorage.setItem('ts-check', JSON.stringify(v)); }catch(e){} } };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d,12); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 可点击名词：t(显示文字, 词条) ；chip(显示文字, 词条, 吉凶)
const has = k => !!(window.GLOSS && GLOSS[k]);
const t = (label, key = label, cat = '') => has(key) ? `<button class="t" data-t="${esc(key)}"${cat ? ` data-c="${cat}"` : ''}>${esc(label)}</button>` : esc(label);
const chip = (label, key = label, cls = '', cat = '') => `<button class="chip ${cls}" ${has(key) ? `data-t="${esc(key)}"${cat ? ` data-c="${cat}"` : ''}` : 'disabled'}>${label}</button>`;
// 与本命的关系用白话讲：按生活方面（年＝长辈、月＝工作父母、日＝自己伴侣、时＝子女下属）＋影响
const AREA_S = ['长辈','工作和父母','自己和伴侣','子女和下属'];
// 影响由重到轻；同一方面最多讲两个，重的已包含轻的（大变动包含冲突、意见不合；冲突包含意见不合）
const REL_EFF = [[r => /^反吟/.test(r.t), '大变动'], [r => r.t === '冲', '冲突'], [r => r.t === '伏吟', '停滞'], [r => r.t === '刑', '摩擦'], [r => r.t === '害', '误会'], [r => /^天干.*冲$/.test(r.t), '意见不合'], [r => r.t === '破', '小波折']];
const relEffs = bad => { let e = REL_EFF.filter(([f]) => bad.some(f)).map(x => x[1]);
  if (e.includes('大变动')) e = e.filter(x => x !== '冲突' && x !== '意见不合'); else if (e.includes('冲突')) e = e.filter(x => x !== '意见不合');
  return e.slice(0, 2); };
const relTop = bad => { const f = REL_EFF.find(([g]) => bad.some(g)); return f ? bad.find(f[0]) : bad[0]; };   // 弹窗解释最重的那个关系
const relKey = r => /伏吟/.test(r) ? '伏吟' : /反吟/.test(r) ? '反吟' : /天干.*合/.test(r) ? '天干合' : /天干.*冲/.test(r) ? '天干冲' : r;

function wangXiang(date){
  const pts = [];
  for (const off of [-200, 0, 200]) { const d = new Date(date); d.setDate(d.getDate()+off); const tbl = Solar.fromDate(d).getLunar().getJieQiTable(); for (const [k,v] of Object.entries(tbl)) if (SI_LI[k]) pts.push({name:k, ymd:v.toYmd()}); }
  const uniq = [...new Map(pts.map(p => [p.ymd,p])).values()].sort((a,b)=>a.ymd<b.ymd?-1:1);
  const today = ymd(date), prev = uniq.filter(p => p.ymd <= today).pop(), next = uniq.find(p => p.ymd > today);
  const daysToNext = Math.round((toDate(next.ymd) - toDate(today)) / 864e5), tuWang = daysToNext <= 18;
  const wang = tuWang ? '土' : SI_LI[prev.name], i = WX.indexOf(wang), state = {};
  state[WX[i]] = '旺'; state[WX[(i+1)%5]] = '相'; state[WX[(i+4)%5]] = '休'; state[WX[(i+3)%5]] = '囚'; state[WX[(i+2)%5]] = '死';
  return {wang, state, tuWang, prev, next, daysToNext};
}
function chkBtn(key){
  if (!cmpMode) return '';
  const v = store.get()[ymd(cur)+'|'+key];
  return `<button class="chk ${v==='ok'?'ok':v==='bad'?'bad':''}" data-key="${esc(key)}">${v==='ok'?'✓ 一致':v==='bad'?'✗ 不同':'对比'}</button>`;
}
const REST = ['馀事勿取','余事勿取'];
function parseYiJi(yi, ji){
  const allBad = ji.includes('诸事不宜'), real = yi.filter(x => !REST.includes(x) && x !== '无');
  return { yiItems: yi, jiItems: ji, restOnly: yi.some(x => REST.includes(x)), allBad, real, jiNote: allBad ? (real.length ? '除「宜」所列几项之外，其他事情都不宜进行' : '今日诸事不宜，宜静不宜动') : '' };
}
const hourRange = k => k===0 ? '23:00–00:59' : `${String(2*k-1).padStart(2,'0')}:00–${String(2*k).padStart(2,'0')}:59`;
const lvlCls = lv => lv === '宜用' ? 'good' : lv === '慎用' ? 'bad' : 'mid';

// ---------- 今日：主栏 ----------
function renderToday(){
  const solar = Solar.fromDate(cur), l = solar.getLunar();
  const jq = l.getJieQi(), fest = [...solar.getFestivals(), ...l.getFestivals(), ...l.getOtherFestivals()];
  const luck = l.getDayTianShenLuck(), yj = parseYiJi(l.getDayYi(), l.getDayJi()), yuePo = l.getDayXiongSha().includes('月破');
  window.DAY_CTX = { label:'今天', yi:new Set(l.getDayYi()), ji:new Set(l.getDayJi()) };
  window.DAY_CHONG = { gz: l.getDayChongDesc().replace(/[()（）].*$/,'').replace(/[()（）]/g,''), full: l.getDayChongDesc(), sx: l.getDayChongShengXiao(), sha: DIR_ALIAS[l.getDaySha()] || l.getDaySha() };
  window.HOUR_CTX = l.getTimes().slice(0,12).map((h,k) => ({ label: h.getZhi()+'时', yi:new Set(h.getYi()), ji:new Set(h.getJi()) }));
  const wx = wangXiang(cur), me = profile ? P.build(profile) : null;
  const tsName = l.getDayTianShen(), good = luck === '吉';
  const dzi = P.zi(l.getDayZhi()), liuHe = P.SX[(13 - dzi) % 12], sanHe = [(dzi + 4) % 12, (dzi + 8) % 12].sort((a, b) => a - b).map(i => P.SX[i]);

  const sa = DIR_ALIAS[l.getDaySha()] || l.getDaySha();
  const gods = [ {name:'财神', dir:l.getDayPositionCaiDesc(), good:true}, {name:'喜神', dir:l.getDayPositionXiDesc(), good:true}, {name:'福神', dir:l.getDayPositionFuDesc(), good:true},
                 {name:'阳贵', dir:l.getDayPositionYangGuiDesc(), good:true}, {name:'阴贵', dir:l.getDayPositionYinGuiDesc(), good:true},
                 {name:'煞方', key:'煞', dir:sa, good:false}, {name:'太岁', dir:l.getDayPositionTaiSuiDesc(), good:false} ];
  const bars = WX.map(w => { const st = wx.state[w], pct = {旺:100,相:78,休:55,囚:34,死:14}[st];
    return `<div class="bar"><span class="el" style="color:${WX_COLOR[w]}">${w}</span><div class="track"><div class="fill" style="width:${pct}%;background:${WX_COLOR[w]}"></div></div><span class="st">${t(st)}</span></div>`; }).join('');
  const openDetails = isDesktop() ? 'open' : '';

  $('colMain').innerHTML = `
  <section class="card" aria-label="今日总览">${chkBtn('基本')}
    <div class="hero">
      <div class="daynum">${solar.getDay()}<small>${solar.getMonth()}月 · 周${WEEK[cur.getDay()]}</small></div>
      <div>
        <div class="lunar">农历${l.getMonthInChinese()}月${l.getDayInChinese()}</div>
        <div class="gz">${l.getYearInGanZhi()}年 ${l.getMonthInGanZhi()}月 ${l.getDayInGanZhi()}日 · 属${l.getYearShengXiao()}</div>
        <div class="badges">
          <span class="badge brand">${t(l.getZhiXing()+'日', l.getZhiXing()+'日', '建除十二值')}</span>
          <span class="badge brand">${t(tsName, tsName, '黄道黑道')}</span>
          ${yuePo ? `<button class="badge bad t" data-t="月破" data-c="凶煞" style="text-decoration:none">月破</button>` : ''}
          <span class="badge brand">${t(l.getXiu()+'宿', '星宿')}</span>
          <span class="badge brand">${t('冲'+l.getDayChongDesc()+' · 煞'+l.getDaySha(), '冲煞')}</span>
          <span class="badge brand">${t('合' + [liuHe, ...sanHe].join('、'), '合生肖', '名词')}</span>
          ${jq ? `<span class="badge brand">${jq}</span>` : ''}
          ${fest.map(f => `<span class="badge brand">${esc(f)}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="yiji">
      <div class="yj"><span class="stamp yi" aria-label="宜">宜</span><div><div class="words">${yj.yiItems.map(x => t(x)).join('')}</div></div></div>
      <div class="yj"><span class="stamp ji" aria-label="忌">忌</span><div><div class="words">${yj.jiItems.map(x => x === '诸事不宜' ? `<span class="strong">${t(x)}</span>` : t(x)).join('')}</div>${yj.jiNote ? `<div class="yjnote">${yj.jiNote}</div>` : ''}</div></div>
    </div>
  </section>

  ${me ? youCard(me, l, wx) : `<section class="card cta"><p>输入你的生辰，就能看到今天对你是什么日、引动哪些神煞、哪个时辰最好。</p><button class="btn primary" data-goto="me">设置我的命盘</button></section>`}

  <details class="card acc" ${openDetails}><summary>方位<span class="sub">上北下南</span></summary><div class="acc-b">${chkBtn('方位')}
    <div class="jg">${['西北','正北','东北','正西','中','正东','西南','正南','东南'].map(p => {
      if (p === '中') return `<div class="c mid"><b>中</b><span class="d">上北下南</span></div>`;
      const here = gods.filter(g => g.dir === p), cls = !here.length ? 'empty' : here.every(g => g.good) ? 'good' : here.every(g => !g.good) ? 'bad' : 'mix';
      return `<div class="c ${cls}"><span class="d">${p}</span>${here.map(g => `<span class="g" style="color:var(--${g.good ? 'good' : 'bad'})">${t(g.name, g.key || g.name, '名词')}</span>`).join('')}</div>`;
    }).join('')}</div>
  </div></details>

  <details class="card acc" ${openDetails}><summary>神煞<span class="sub">吉神 ${l.getDayJiShen().length} · 凶煞 ${l.getDayXiongSha().length}</span></summary><div class="acc-b">${chkBtn('神煞')}
    <dl class="kv">
      <dt>吉神宜趋</dt><dd class="chips">${l.getDayJiShen().map(x => chip(x, x, 'good', '吉神')).join('')}</dd>
      <dt>凶煞宜忌</dt><dd class="chips">${l.getDayXiongSha().map(x => chip(x, x, 'bad', '凶煞')).join('')}</dd>
      <dt>${t('冲煞')}</dt><dd>冲${l.getDayChongDesc()}，煞${l.getDaySha()}</dd>
      <dt>${t('合生肖', '合生肖', '名词')}</dt><dd>六合 ${liuHe}；三合 ${sanHe.join('、')}</dd>
      <dt>${t('彭祖百忌')}</dt><dd>${l.getPengZuGan()}；${l.getPengZuZhi()}</dd>
      <dt>${t('胎神')}</dt><dd>${l.getDayPositionTai()}</dd>
      <dt>${t('日禄')}</dt><dd>${l.getDayLu()}</dd>
      <dt>${t('旬空')}</dt><dd>${l.getDayXun()}旬 · 空${l.getDayXunKong()}</dd>
      <dt>${t('纳音')}</dt><dd>年 ${l.getYearNaYin()} · 月 ${l.getMonthNaYin()} · 日 ${l.getDayNaYin()}</dd>
      <dt>${t('月相')}</dt><dd>${l.getYueXiang()}</dd>
    </dl></div></details>

  <details class="card acc" ${openDetails}><summary>季节五行<span class="sub">${wx.wang}最旺 · ${wx.tuWang ? `${wx.next.name}前土旺` : `${wx.prev.name}后`}</span></summary><div class="acc-b">${chkBtn('五行')}
    <p class="intro">这是<b>季节</b>的五行：${wx.tuWang ? `${wx.next.name}前约十八天是「${t('土旺用事')}」` : `${wx.prev.name}之后`}，天地间<b>${wx.wang}气最旺</b>、${WX.find(w => wx.state[w] === '死')}气最弱。跟个人八字无关，大约三个月才换一次。</p>
    <p class="intro">它和今天日子本身的五行（${l.getDayGan()}${P.WX[P.GAN_WX[P.gi(l.getDayGan())]]}、${l.getDayZhi()}${P.WX[P.ZHI_WX[P.zi(l.getDayZhi())]]}）不是同一回事，所以两者不一样很正常。</p>
    <div class="bars">${bars}</div>
    <div class="note">${['旺','相','休','囚','死'].map(x => t(x)).join(' → ')}，由强到弱。</div>
    <dl class="kv" style="margin-top:16px"><dt>换季</dt><dd>${wx.next.name}（${wx.next.ymd}）起，${SI_LI[wx.next.name]}气当令</dd></dl>
  </div></details>`;

  renderHours(l, me);
}

// ---------- 今日对你 ----------
const WX_SWATCH = [[['绿','#3f8f4f'],['青','#2a8a8a']], [['红','#d2453a'],['紫','#7b4fa0'],['橙','#e07b2e'],['粉','#e89ab0']],
                   [['黄','#e3b740'],['咖啡','#6f4e37'],['棕','#8b5e34'],['卡其','#c3b091']], [['白','#ffffff'],['银','#c0c0c0'],['金','#d4af37'],['杏','#f3e1c4']],
                   [['黑','#1f1f1f'],['蓝','#2f5fa8'],['灰','#8a8a8a']]];
const swatches = es => es.flatMap(e => WX_SWATCH[e]).map(([nm, hex]) => `<span class="sw"><i style="background:${hex}"></i>${nm}</span>`).join('');
function youCard(n, l, wx){
  const tt = P.today(n, l, wx.wang), dh = P.dayHours(n, l), lc = P.luckyColor(n, tt);
  const tg = tt.tags.map(x => x.t);
  // 已经用本命日标签说了的冲、刑，不在总结里重复
  const covered = r => (r.t === '冲' && r.k === 0 && (tg.includes('冲生肖日') || tg.includes('天克地冲日'))) || (r.t === '冲' && r.k === 2 && tg.includes('冲本命日')) || (r.t === '刑' && r.k === 0 && tg.includes('三刑日'));
  // 每个生活方面一条：有不好的关系就讲影响，否则是「和顺」；已经用本命日标签讲了的冲、刑不重复
  const areas = [0, 1, 2, 3].map(k => { const rs = tt.rels.filter(r => r.k === k && !covered(r)), bad = rs.filter(r => r.bad);
    return {k, rs, bad, eff: relEffs(bad)}; }).filter(a => a.rs.length);
  const parts = [tt.advice.replace(/。$/, '')];
  // 留意：和本命的冲刑害破（按生活方面、用白话），加上不好的神煞的提醒（只写白话，不写神煞名）；好的神煞已变成本命日标签
  // 同样影响的方面合成一句，如「长辈、工作和父母方面容易有小波折」
  const byEff = {}; areas.filter(a => a.bad.length).forEach(a => { const k = a.eff.join('、'); (byEff[k] = byEff[k] || []).push(AREA_S[a.k]); });
  const watch = [...Object.entries(byEff).map(([e, ns]) => `${ns.join('、')}方面容易有${e}`), ...tt.sha.filter(x => BAD_SHA.includes(x)).map(x => BAD_SHA_PLAIN[x])];
  if (watch.length) parts.push(`留意${watch.join('，')}`);
  // 时辰另起一段，按时间先后排，并写上钟表时间
  const hrs = hs => [...hs].sort((a, b) => a.k - b.k).map(h => `<span class="nw"><b>${h.zhi}时</b> ${hourRange(h.k)}</span>`).join('');
  const hourLines = [dh.best.length && `<div class="hrow"><span class="hl good">较好的时辰</span><span class="hlist">${hrs(dh.best)}</span></div>`, dh.avoid.length && `<div class="hrow"><span class="hl bad">尽量避开</span><span class="hlist">${hrs(dh.avoid)}</span></div>`].filter(Boolean).join('');
  const stars = `<span class="stars" title="综合参考分">${'★'.repeat(tt.stars)}<span class="off">${'★'.repeat(5-tt.stars)}</span></span>`;
  const bz = n.pillars.map(p => p ? ganC(p[0]) + zhiC(p[1]) : '').filter(Boolean).join(' ');
  return `<section class="card you" aria-label="今日对你">${chkBtn('个人今日')}
    <div class="you-h"><div><h2>今日对你</h2><div class="by">根据你的八字推算　<b>${bz}</b>${n.hasTime ? '' : '（时辰未知）'}</div></div></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
      <div class="title">你的<em>${t(tt.ss+'日', tt.ss)}</em></div>${stars}
    </div>
    <div class="daytags">${tt.tags.map(x => `<button class="dtag ${x.bad ? 'bad' : x.mid ? 'mid' : 'good'}" data-t="${x.t}" data-c="本命日">${x.t}</button>`).join('')}</div>
    <div class="summary"><p>${parts.join('；')}。</p>${hourLines ? `<div class="sum-hours">${hourLines}</div>` : ''}</div>
    <div class="facts">
      <div class="fact"><span class="label">今日五行</span><div class="serif">${tt.dayWx.map((i,k) => `<span style="color:${wxc(i)}">${k ? tt.dz : tt.dg}${P.WX[i]}</span>`).join('　')}</div></div>
      <div class="fact"><span class="label">幸运色</span><div class="sw-row">${swatches([lc.lucky])}</div></div>
      <div class="fact"><span class="label">不宜色</span><div class="sw-row">${swatches(lc.avoid)}</div></div>
      <div class="fact"><span class="label">流年</span><div>${tt.ly}（${t(tt.lySS)}）${tt.ty.length ? `　<span class="badge bad">${tt.ty.join('、')}</span>` : ''}</div></div>
      ${tt.dy ? `<div class="fact"><span class="label">大运</span><div>${tt.dy.getGanZhi()}（${t(P.shiShen(n.dayGan, tt.dy.getGanZhi()[0]))}运，${tt.dy.getStartYear()}–${tt.dy.getEndYear()}）</div></div>` : ''}
    </div>
    <div class="note">星级为规则加总的参考分。</div>
  </section>`;
}

// ---------- 时辰（电脑在右栏、手机是独立分页） ----------
function renderHours(l, me){
  const isToday = ymd(cur) === ymd(new Date()), nowH = new Date().getHours();
  const nowIdx = Math.floor(((nowH + 1) % 24) / 2);
  const dh = me ? P.dayHours(me, l) : null;
  const times = l.getTimes().slice(0, 12);
  if (openHour === null) openHour = isToday ? nowIdx : null;
  // 通书不把日破（冲当天）或「诸事不宜」的时辰列为吉时，即使是黄道
  const flaw = times.map(h => P.hourSha(l, h).some(([x]) => x === '日破') ? '日破' : h.getJi().includes('诸事不宜') ? '诸事不宜' : '');
  const cls = k => dh ? lvlCls(dh.hours[k].level) : (times[k].getTianShenLuck() === '吉' && !flaw[k] ? 'good' : 'bad');

    let tt = null, dh = null;
    if (me) { tt = P.today(me, l, wangXiang(dt).wang); if (pick.minStar && tt.stars < pick.minStar) continue; }
    const hits = [...AVOID_GEN.filter(([, , f]) => f(l, xs, dt)), ...(tt ? AVOID_ME.filter(([, , f]) => f(tt)) : [])].map(a => a[0]);
    hits.forEach(x => { cnt[x] = (cnt[x] || 0) + 1; });
    if (hits.some(x => pick.avoid.includes(x))) continue;
    if (me) dh = P.dayHours(me, l);
    // 适合做这件事的时辰：时辰的宜里有这件事，且不是黑道、日破、诸事不宜；有八字时再去掉对你「慎用」的
    const times = l.getTimes().slice(0, 12), hd = l.getDayTianShenLuck() === '吉';
    const okH = (h, k) => h.getTianShenLuck() === '吉' && !P.hourSha(l, h).some(([x]) => x === '日破') && !h.getJi().includes('诸事不宜') && !(dh && dh.hours[k].level === '慎用');
    let hours = times.filter((h, k) => okH(h, k) && terms.some(x => h.getYi().includes(x)));
    if (!hours.length) hours = times.filter(okH);
    const de = l.getDayJiShen().filter(x => DE_SHEN.includes(x));
    out.push({dt: new Date(dt), l, hd, de, tt, hours: hours.map(h => h.getZhi()), score: (tt ? tt.stars * 2 : 6) + (hd ? 1 : 0) + de.length * .5});
  }
  return {rs: out, cnt};
}

function pickRow(r){
  const {dt, l} = r, we = dt.getDay() === 0 || dt.getDay() === 6;
  const stars = r.tt ? `<span class="stars">${'★'.repeat(r.tt.stars)}<span class="off">${'★'.repeat(5 - r.tt.stars)}</span></span>` : '';
  return `<button class="pk-row" data-day="${ymd(dt)}">
    <span class="pk-date ${we ? 'we' : ''}"><b>${dt.getMonth() + 1}月${dt.getDate()}日</b><span>周${WEEK[dt.getDay()]}</span></span>
    <span class="pk-main"><span class="pk-l1"><span class="nw">农历${l.getMonthInChinese()}月${l.getDayInChinese()} · ${l.getDayInGanZhi()}日</span> <span class="badge brand">${l.getZhiXing()}日</span><span class="badge brand">${l.getDayTianShen()}</span></span>
      <span class="pk-l2">${r.hours.length ? `吉时：${r.hours.map(z => z + '时').join('、')}` : '当天没有特别好的时辰'}${r.de.length ? `　吉神：${r.de.join('、')}` : ''}</span>${r.tt ? `<span class="pk-l2">${r.tt.tags.map(x => `<b style="color:var(--${x.bad ? 'bad' : x.mid ? 'muted' : 'good'})">${x.t}</b>`).join('、')}</span>` : ''}</span>
    <span class="pk-side">${stars}</span>
  </button>`;
}

function renderPick(){
  const me = profile ? P.build(profile) : null, {rs, cnt} = pickDays(me), terms = pickTerms(), name = pick.term ? (PLAIN_OF[pick.term] ? `${pick.term}（${PLAIN_OF[pick.term]}）` : pick.term) : pick.act;
  const avoids = [...(me ? AVOID_ME : []), ...AVOID_GEN].map(a => a[0]).filter(x => pick.avoid.includes(x));
  const cond = [pick.wd.length && `只看星期${WD_ORDER.filter(w => pick.wd.includes(w)).map(w => WEEK[w]).join('、')}`, me && pick.minStar && `对你 ${'★'.repeat(pick.minStar)} 以上`,
                pick.jc.length && `建除只看${JIANCHU.filter(x => pick.jc.includes(x)).join('、')}日`, avoids.length && `已避开${avoids.join('、')}`].filter(Boolean);
  let list;
  if (!rs.length) list = `<p class="pk-empty">这段时间没有找到适合「${esc(name)}」的日子。可以把日期拉长，或少选几个条件。</p>`;
  else if (pick.sort === 'best') list = [...rs].sort((a, b) => b.score - a.score || a.dt - b.dt).map(pickRow).join('');
  else { let m = ''; list = rs.map(r => { const k = `${r.dt.getFullYear()}年${r.dt.getMonth() + 1}月`, h = k !== m ? `<div class="pk-month">${k}</div>` : ''; m = k; return h + pickRow(r); }).join(''); }
  $('viewPick').innerHTML = pickForm(me, cnt) + `<section class="card">
    <div class="card-h"><h2>找到 ${rs.length} 天</h2><span class="sub">${ymd(pickStart)} 至 ${ymd(pickEnd)}</span></div>
    <p class="note" style="margin:-4px 0 12px">适合「${esc(name)}」${pick.term ? '' : `（通书写作：${terms.join('、')}）`}的日子${cond.length ? '；' + cond.join('，') : ''}。点日子可看当天详细。</p>
    ${rs.length > 1 ? `<div class="pk-sort"><button class="opt" data-sort="date" ${pressed(pick.sort !== 'best')}>按日期</button><button class="opt" data-sort="best" ${pressed(pick.sort === 'best')}>${me ? '按对我推荐' : '按推荐'}</button></div>` : ''}
    ${list}
  </section>`;
}

$('viewPick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.cat) { pick.cat = d.cat; pick.act = (CATS.find(c => c[0] === pick.cat) || CATS[0])[1][0][0]; pick.term = ''; }
  else if (d.act) { pick.act = d.act; pick.term = ''; }
  else if (d.more) { moreOpen = !moreOpen; renderPick(); return; }
  else if (d.term) { pick.term = d.term; pick.cat = (RAW_CATS.find(([, ts]) => ts.includes(d.term)) || [pick.cat])[0]; moreOpen = false; }
  else if (d.len) pickEnd = addDays(pickStart, +d.len);
  else if (d.wd) pick.wd = toggleIn(pick.wd, +d.wd);
  else if (d.wdset) pick.wd = d.wdset === 'we' ? [6, 0] : [];
  else if (d.star !== undefined) pick.minStar = +d.star;
  else if (d.jc) pick.jc = toggleIn(pick.jc, d.jc);
  else if (d.jcset) pick.jc = [];
  else if (d.avoid) pick.avoid = toggleIn(pick.avoid, d.avoid);
  else if (d.avset) pick.avoid = d.avset === 'rec' ? [...AVOID_REC] : [];
  else if (d.sort) pick.sort = d.sort;
  else if (d.day) { const [y, m, dd] = d.day.split('-').map(Number); cur = new Date(y, m - 1, dd, 12); openHour = null; setTab('today'); return; }
  else return;
  savePick(); renderPick();
});
$('viewPick').addEventListener('change', e => {
  const id = e.target.id;
  if (/^pk[SE][YMD]$/.test(id)) {
    const p = id.slice(0, 3), y = +$(p + 'Y').value, m = +$(p + 'M').value, dim = new Date(y, m, 0).getDate(), d = new Date(y, m - 1, Math.min(+$(p + 'D').value, dim), 12);
    if (p === 'pkS') { const span = pickEnd - pickStart; pickStart = d; if (pickEnd < pickStart) pickEnd = new Date(pickStart.getTime() + span); }
    else pickEnd = d < pickStart ? new Date(pickStart) : d;
    if (pickEnd - pickStart > 3 * 366 * 864e5) pickEnd = addDays(pickStart, 3 * 366);   // 最多三年
  } else return;
  savePick(); renderPick();
});

// ---------- 页面切换 ----------
function render(){
  $('dateLabel').textContent = isDesktop() ? `${cur.getFullYear()}年${cur.getMonth()+1}月${cur.getDate()}日 · 星期${WEEK[cur.getDay()]}` : `${cur.getMonth()+1}月${cur.getDate()}日 · 周${WEEK[cur.getDay()]}`;
  document.body.dataset.tab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => { if (b.tagName === 'BUTTON') b.setAttribute('aria-selected', b.dataset.tab === tab || (tab === 'hours' && b.dataset.tab === 'today' && isDesktop())); });
  if (tab === 'me') renderMe(); else if (tab === 'pick') renderPick(); else renderToday();
}
function setTab(x){ tab = x; history.replaceState(null, '', location.search + (x === 'me' ? '#me' : x === 'hours' ? '#hours' : x === 'pick' ? '#pick' : '')); render(); window.scrollTo({top:0}); }
function shift(n){ cur.setDate(cur.getDate()+n); openHour = null; render(); }
document.querySelectorAll('button[data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
$('today').onclick = () => { cur = new Date(); cur.setHours(12,0,0,0); openHour = null; render(); };
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function paintThemeBtn(){ const dark = document.documentElement.dataset.theme === 'dark'; $('themeBtn').innerHTML = dark ? ICON_SUN : ICON_MOON; $('themeBtn').title = dark ? '切换浅色' : '切换深色'; }
$('themeBtn').onclick = () => { const dark = document.documentElement.dataset.theme !== 'dark'; if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme; try { localStorage.setItem('ts-theme', dark ? 'dark' : 'light'); } catch(e) {} paintThemeBtn(); render(); };
paintThemeBtn();
addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(render, 200); });

// ---------- 日历 ----------
let calY, calM;
function calLabel(d){
  const l = Solar.fromYmd(d.getFullYear(), d.getMonth()+1, d.getDate()).getLunar(), jq = l.getJieQi();
  if (jq) return `<small class="jq">${jq}</small>`;
  if (l.getDay() === 1) return `<small class="jq">${l.getMonthInChinese()}月</small>`;
  return `<small>${l.getDayInChinese()}</small>`;
}
function renderCal(){
  const first = new Date(calY, calM, 1, 12), days = new Date(calY, calM+1, 0).getDate(), todayS = ymd(new Date()), selS = ymd(cur);
  let years = ''; for (let y = 1900; y <= 2100; y++) years += `<option value="${y}" ${y===calY?'selected':''}>${y}年</option>`;
  let months = ''; for (let m = 0; m < 12; m++) months += `<option value="${m}" ${m===calM?'selected':''}>${m+1}月</option>`;
  let cells = '<span></span>'.repeat(first.getDay());
  for (let d = 1; d <= days; d++) { const dt = new Date(calY, calM, d, 12), s = ymd(dt); cells += `<button type="button" data-day="${s}" class="${s===selS?'sel':''} ${s===todayS?'today':''}"><b>${d}</b>${calLabel(dt)}</button>`; }
  $('cal').innerHTML = `<div class="cal-h"><button type="button" class="iconbtn" data-cal="-1" aria-label="上个月">‹</button><div class="sel"><select id="calY" aria-label="年份">${years}</select><select id="calM" aria-label="月份">${months}</select></div><button type="button" class="iconbtn" data-cal="1" aria-label="下个月">›</button></div>
    <div class="cal-w">${'日一二三四五六'.split('').map(w => `<span>${w}</span>`).join('')}</div><div class="cal-g">${cells}</div>
    <div class="cal-f"><button type="button" class="btn ghost" data-cal="today">今天</button><button type="button" class="btn ghost" data-cal="close">关闭</button></div>`;
  $('calY').onchange = e => { calY = +e.target.value; renderCal(); };
  $('calM').onchange = e => { calM = +e.target.value; renderCal(); };
}
function openCal(){ calY = cur.getFullYear(); calM = cur.getMonth(); renderCal(); $('cal').hidden = false; $('calBack').hidden = false; $('datePick').setAttribute('aria-expanded','true'); }
function closeCal(){ $('cal').hidden = true; $('calBack').hidden = true; $('datePick').setAttribute('aria-expanded','false'); }
$('datePick').onclick = () => { $('cal').hidden ? openCal() : closeCal(); };
$('calBack').onclick = closeCal;
$('cal').addEventListener('click', e => {
  const day = e.target.closest('[data-day]'); if (day) { cur = toDate(day.dataset.day); openHour = null; closeCal(); render(); return; }
  const c = e.target.closest('[data-cal]'); if (!c) return; const v = c.dataset.cal;
  if (v === 'close') return closeCal();
  if (v === 'today') { cur = new Date(); cur.setHours(12,0,0,0); openHour = null; closeCal(); render(); return; }
  calM += +v; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } renderCal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('sheet').hidden) closeTerm(); if (!$('cal').hidden) closeCal(); } });

// ---------- 统一点击 ----------
document.addEventListener('click', e => {
  const term = e.target.closest('[data-t]'); if (term) { const hr = term.closest('.hr'); const ctx = tab === 'me' ? null : hr ? (window.HOUR_CTX || [])[+hr.id.slice(2)] : window.DAY_CTX; openTerm(term.dataset.t, ctx, term.dataset.c); return; }
  const g = e.target.closest('[data-goto]'); if (g) { setTab(g.dataset.goto); return; }
  const tog = e.target.closest('[data-toggle]'); if (tog) { const k = +tog.dataset.toggle; openHour = openHour === k ? -1 : k; render(); return; }
  const hb = e.target.closest('[data-hour]'); if (hb) { openHour = +hb.dataset.hour; render(); requestAnimationFrame(() => { const el = $('hr' + openHour); if (el) el.scrollIntoView({ block:'nearest', behavior:'smooth' }); }); return; }
  const b = e.target.closest('.chk'); if (!b) return;
  const all = store.get(), k = ymd(cur)+'|'+b.dataset.key;
  all[k] = all[k]===undefined ? 'ok' : all[k]==='ok' ? 'bad' : undefined; if (all[k]===undefined) delete all[k];
  store.set(all); render();
});
$('cmp').onclick = e => { cmpMode = !cmpMode; e.target.classList.toggle('on', cmpMode); render(); };
$('export').onclick = () => {
  const rows = [['日期','栏目','结果'], ...Object.entries(store.get()).map(([k,v]) => [...k.split('|'), v==='ok'?'一致':'不同'])];
  const blob = new Blob(['﻿'+rows.map(r => r.join(',')).join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '通胜对比.csv'; a.click();
};
$('clear').onclick = () => { if (confirm('清除所有对比记录？')) { store.set({}); render(); } };
document.addEventListener('keydown', e => { if (tab === 'me' || tab === 'pick' || !$('cal').hidden || !$('sheet').hidden || /INPUT|SELECT/.test(e.target.tagName)) return; if (e.key === 'ArrowLeft') shift(-1); if (e.key === 'ArrowRight') shift(1); });

const qs = new URLSearchParams(location.search);
if (qs.get('birth')) profile = { date: qs.get('birth'), time: qs.get('time') || '', gender: qs.get('g') || '' };
if (location.hash === '#me') tab = 'me'; else if (location.hash === '#hours') tab = 'hours'; else if (location.hash === '#pick') tab = 'pick';

// ---------- 生辰下拉选单 ----------
const pad = n => String(n).padStart(2,'0');
const opt = (v, x) => `<option value="${v}">${x}</option>`;
(function initBirthSelects(){
  const thisY = new Date().getFullYear();
  let y = opt('', '年'); for (let i = thisY; i >= 1920; i--) y += opt(i, i+'年');
  let m = opt('', '月'); for (let i = 1; i <= 12; i++) m += opt(i, i+'月');
  let h = opt('', '不知道时辰'); for (let i = 0; i <= 23; i++) h += opt(i, `${pad(i)}点（${'子丑寅卯辰巳午未申酉戌亥'[Math.floor((i+1)/2)%12]}时）`);
  let mi = ''; for (let i = 0; i < 60; i++) mi += opt(i, pad(i)+'分');
  $('meY').innerHTML = y; $('meM').innerHTML = m; $('meH').innerHTML = h; $('meMin').innerHTML = mi; fillDays();
})();
function fillDays(){
  const y = +$('meY').value || 2000, m = +$('meM').value || 1, keep = $('meD').value, n = new Date(y, m, 0).getDate();
  let d = opt('', '日'); for (let i = 1; i <= n; i++) d += opt(i, i+'日');
  $('meD').innerHTML = d; if (keep && +keep <= n) $('meD').value = keep;
}
$('meY').onchange = fillDays; $('meM').onchange = fillDays;
$('meH').onchange = () => { $('meMin').disabled = $('meH').value === ''; };
function fillForm(){
  if (!profile) { $('meMin').disabled = true; return; }
  const [y,m,d] = profile.date.split('-').map(Number);
  $('meY').value = y; $('meM').value = m; fillDays(); $('meD').value = d;
  if (profile.time) { const [hh,mm] = profile.time.split(':').map(Number); $('meH').value = hh; $('meMin').value = mm; } else $('meH').value = '';
  $('meMin').disabled = !profile.time; $('meGender').value = profile.gender || '';
}
$('meForm').onsubmit = e => {
  e.preventDefault();
  const y = $('meY').value, m = $('meM').value, d = $('meD').value;
  if (!y || !m || !d) { $('meErr').textContent = '请选择完整的出生年、月、日。'; $('meErr').hidden = false; return; }
  $('meErr').hidden = true; const h = $('meH').value;
  profile = { date: `${y}-${pad(m)}-${pad(d)}`, time: h === '' ? '' : `${pad(h)}:${pad($('meMin').value)}`, gender: $('meGender').value };
  try { localStorage.setItem('ts-me', JSON.stringify(profile)); } catch(e) {}
  render();
};
$('natal').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dy !== undefined) { natalDy = +b.dataset.dy; renderMe(); }
  else if (b.dataset.ny) { natalYear += +b.dataset.ny; renderMe(); }
});
$('meClear').onclick = () => { profile = null; try { localStorage.removeItem('ts-me'); } catch(e) {} $('meForm').reset(); fillDays(); $('meMin').disabled = true; $('meErr').hidden = true; render(); };
fillForm();
render();
</script>
